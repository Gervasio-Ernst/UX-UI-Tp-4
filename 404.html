<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada - Coffea</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/main.css">
  
  <style>
    .not-found {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background-color: var(--color-bg);
      color: var(--color-espresso);
      padding: 2rem;
    }
    .not-found__code {
      font-family: var(--font-display);
      font-size: 8rem;
      font-weight: 700;
      color: var(--color-maroon);
      line-height: 1;
      margin-bottom: 1rem;
    }
    .not-found__title {
      font-family: var(--font-display);
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }
    .not-found__text {
      font-family: var(--font-body);
      font-size: 1.125rem;
      max-width: 450px;
      margin-bottom: 2rem;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <main class="not-found">
    <span class="not-found__code">404</span>
    <h1 class="not-found__title">¡Vaya! Te has quedado sin café</h1>
    <p class="not-found__text">La página que estás buscando no existe o ha sido movida a otra mesa. Regresa al inicio para disfrutar de nuestros mejores productos.</p>
    <a href="index.html" class="btn btn--espresso">Volver al inicio</a>
  </main>
</body>
</html>
